<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansh Cloud IDE</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { background: #252526; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .btn-group { display: flex; gap: 8px; }
        .run-btn { background: #28a745; color: white; border: none; padding: 8px 14px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .pwa-btn { background: #007acc; color: white; border: none; padding: 8px 14px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .workspace { display: flex; flex-direction: column; flex: 1; }
        .tabs { display: flex; background: #2d2d2d; }
        .tab { padding: 10px 15px; cursor: pointer; color: #aaa; background: #2d2d2d; border-right: 1px solid #1e1e1e; }
        .tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #007acc; }
        #editor { flex: 1; min-height: 45vh; }
        .output-box { height: 35vh; background: #121212; border-top: 2px solid #333; display: flex; flex-direction: column; }
        .output-header { background: #252526; padding: 6px 12px; font-size: 12px; color: #aaa; }
        #terminal { padding: 10px; font-family: monospace; color: #00ff00; overflow-y: auto; flex: 1; white-space: pre-wrap; }
        #livePreview { width: 100%; height: 100%; border: none; background: white; display: none; }
    </style>
</head>
<body>

    <header>
        <span style="font-weight: bold; color: #007acc;">Ansh Online Web IDE</span>
        <div class="btn-group">
            <button class="run-btn" onclick="runCode()">▶ Run</button>
            <button class="pwa-btn" onclick="installApp()">📲 Export App</button>
        </div>
    </header>

    <div class="workspace">
        <div class="tabs" id="tabs"></div>
        <div id="editor"></div>

        <div class="output-box">
            <div class="output-header">OUTPUT TERMINAL / PREVIEW</div>
            <div id="terminal">Press 'Run' to execute code.</div>
            <iframe id="livePreview"></iframe>
        </div>
    </div>

    <script>
        let editor;
        let files = {
            'index.html': '<h1>My Web App</h1>\n<p>This is created inside Ansh Cloud IDE!</p>',
            'main.py': 'print("Hello World!")',
            'app.js': 'console.log("App Ready!");'
        };
        let activeFile = 'index.html';
        let deferredPrompt;

        // Register Service Worker for PWA
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        alert('App Installed Successfully on Phone!');
                    }
                    deferredPrompt = null;
                });
            } else {
                alert('Browser Menu (3 Dots) -> "Add to Home Screen" par click karke app install karein!');
            }
        }

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: files[activeFile],
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true
            });

            editor.onDidChangeModelContent(() => {
                files[activeFile] = editor.getValue();
            });

            renderTabs();
        });

        function renderTabs() {
            const container = document.getElementById('tabs');
            container.innerHTML = '';
            for (let f in files) {
                const tab = document.createElement('div');
                tab.className = 'tab' + (f === activeFile ? ' active' : '');
                tab.innerText = f;
                tab.onclick = () => switchFile(f);
                container.appendChild(tab);
            }
        }

        function switchFile(f) {
            activeFile = f;
            editor.setValue(files[f]);
            let lang = f.endsWith('.py') ? 'python' : f.endsWith('.html') ? 'html' : 'javascript';
            monaco.editor.setModelLanguage(editor.getModel(), lang);
            renderTabs();
        }

        async function runCode() {
            const term = document.getElementById('terminal');
            const prev = document.getElementById('livePreview');

            if (activeFile.endsWith('.html')) {
                term.style.display = 'none';
                prev.style.display = 'block';
                prev.srcdoc = files[activeFile];
            } else {
                prev.style.display = 'none';
                term.style.display = 'block';
                term.innerText = "Executing on server...";

                try {
                    const res = await fetch('/api/run', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: activeFile, code: files[activeFile] })
                    });
                    const data = await res.json();
                    term.innerText = data.output || data.error;
                } catch (err) {
                    term.innerText = "Error connecting to server.";
                }
            }
        }
    </script>
</body>
</html>
